server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    # Access control: allow the home LAN through with no prompt, require a
    # valid credential for everyone else. Real credentials live in
    # /etc/nginx/.htpasswd, provisioned at runtime (see nginx/README.md) —
    # never committed to this repo.
    satisfy any;

    # TODO: confirm/adjust this CIDR for the actual home LAN range.
    allow 192.168.1.0/24;
    deny all;

    auth_basic "Documentation";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Immutable caching for content-hashed assets (see Quartz hosting docs)
    location ~* \.(css|js)$ {
        if ($uri ~* "-[0-9a-f]{8}\.") {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
