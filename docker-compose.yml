services:
  documentation:
    image: ghcr.io/usiko/documentation:latest
    container_name: documentation
    restart: unless-stopped
    ports:
      - "8080:80"
    # Uncomment once ./secrets/.htpasswd exists on the host (see nginx/README.md).
    # A missing bind-mount source would otherwise be created as an empty
    # directory and break nginx, which expects a file at that path.
    # volumes:
    #   - ./secrets/.htpasswd:/etc/nginx/.htpasswd:ro
